<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Myntra Bag</title>
  <style>
    div{
      align-content: center;
    }
    .addToBag{
      border: none;
      padding: 5px;
      padding-right: 10px;
      padding-left: 10px;
      background-color: rgb(111, 213, 111);
      border-radius: 10px;
      margin-right: 20px;
    }
    .moveToWishlist{
      padding: 5px;
      padding-left: 20px;
      padding-right: 20px;
      border: 2px solid black;
      border-radius: 10px;
      margin-right: 20px;
      text-transform: uppercase;
    }
    .addOneItem{
      border: none;
      padding: 5px;
      padding-right: 10px;
      padding-left: 10px;
      background-color: rgb(111, 213, 111);
      border-radius: 10px;
      margin-right: 20px;

    }

  </style>
</head>
<body>
  <div>
    <button class="addToBag" onclick="cartQuantity+=1; document.querySelector('#cart-summery').innerText=`Your Cart Has ${cartQuantity} Items `">Add to Bag</button>
    <button class="moveToWishlist" onclick="cartQuantity-=1; document.querySelector('#cart-summery').innerText=`Your Cart Has ${cartQuantity} Items `">❤️ Move to Wishlist</button>
    <button class="addOneItem" onclick="cartQuantity+=2; document.querySelector('#cart-summery').innerText=`Your Cart Has ${cartQuantity} Items `">Add 1+1 sale item</button>
    <h1 id="cart-summery"></h1>
  </div>

  <script>
    let cartQuantity = 0;
    document.querySelector('#cart-summery').innerText=`Your Cart Has ${cartQuantity} Items `
  </script>
  
</body>
</html>
