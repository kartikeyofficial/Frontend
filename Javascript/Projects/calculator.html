<!DOCTYPE html>
<html lang="en">
<head>
  <title>Calculator</title>
  <style>
    .calculator{
      border: 1px solid rgb(163, 161, 161);
      border-radius: 8px;
      width: 250px;
      background-color: rgb(188, 185, 185);
      
    }
    #display{
      margin: 10px;
      margin-left: 13px;
      width: 86%;
      padding-bottom: 10px;
      font-size: 20px;
    }
    .button-container{
      margin: 30px;
      width: 100%;

    }
    button{
      padding: 15px;
      padding-left:20px ;
      padding-right: 20px;
      margin-top: 10px;
      margin-right: 10px;
    }
    button:hover{
      background-color: rgb(196, 233, 233);
    }

  </style>
</head>
<body>
  <div class="calculator">
  <input type="text" name="" id="display">
  <div class="button-container">
  <button onclick="currentDisplay ='';document.querySelector('#display').value=currentDisplay;">C</button>
  <button onclick="currentDisplay+='1';document.querySelector('#display').value=currentDisplay;">1</button>
  <button onclick="currentDisplay+='2';document.querySelector('#display').value=currentDisplay;">2</button><br>
  <button onclick="currentDisplay+='+';document.querySelector('#display').value=currentDisplay;">+</button>
  <button onclick="currentDisplay+='3';document.querySelector('#display').value=currentDisplay;">3</button>
  <button onclick="currentDisplay+='4';document.querySelector('#display').value=currentDisplay;">4</button><br>
  <button onclick="currentDisplay+='-';document.querySelector('#display').value=currentDisplay;">-</button>
  <button onclick="currentDisplay+='5';document.querySelector('#display').value=currentDisplay;">5</button>
  <button onclick="currentDisplay+='6';document.querySelector('#display').value=currentDisplay;">6</button><br>
  <button onclick="currentDisplay+='*';document.querySelector('#display').value=currentDisplay;">*</button>
  <button onclick="currentDisplay+='7';document.querySelector('#display').value=currentDisplay;">7</button>
  <button onclick="currentDisplay+='8';document.querySelector('#display').value=currentDisplay;">8</button><br>
  <button onclick="currentDisplay+='/';document.querySelector('#display').value=currentDisplay;">/</button>
  <button onclick=" currentDisplay=eval(currentDisplay);document.querySelector('#display').value=currentDisplay;">=</button>
  <button onclick="currentDisplay+=9;document.querySelector('#display').value=currentDisplay;">9</button><br>
  <button onclick="currentDisplay+=0;document.querySelector('#display').value=currentDisplay;">0</button>
  <button onclick="currentDisplay+='.';document.querySelector('#display').value=currentDisplay;">.</button>
  </div>

  </div>
  <script>
    let currentDisplay = 0;
    document.querySelector('#display').value=currentDisplay;

  </script>
  
</body>
</html>
