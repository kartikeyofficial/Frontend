<!DOCTYPE html>
<html lang="en">
<head>
  
  <title>Cricket bat & ball</title>
  <style>
    .container{
      align-items: center;
      align-items: center;
      text-align: center;
    }
    .bat{
      padding: 5px;
      padding-left: 10px;
      padding-right: 10px;
      border: none;
      background-color: #84eb1d;
      border-radius: 8px;
      margin-right: 10px;
    }
    .ball{
      padding: 5px;
      padding-left: 10px;
      padding-right: 10px;
      border: none;
      background-color: #e7d90e;
      border-radius: 8px;
      margin-right: 10px;
    }
    .stump{
      padding: 5px;
      padding-left: 10px;
      padding-right: 10px;
      border: none;
      background-color: #e24a13;
      border-radius: 8px;
      margin-right: 10px;
    }
  </style>
</head>
<body>
  <div class="container">
  <h1>Bat Ball Stump Game</h1>
  <div class="buttons">
  <button class="bat" onclick="
    const userChoiceMessage = ('You Have Choosen The Bat');
    let randomNumber = Math.random()*3;
    let computerChoice= 'Bat';
    if(randomNumber>1 && randomNumber<=1){
       computerChoice = 'Bat'
      console.log('computer choice is bat');

    }
    else if(randomNumber>1 && randomNumber<=2){
       computerChoice = 'Ball'
      // console.log('computer choice is ball');
    }
    else{
       computerChoice = 'Stump'
      // console.log('computer choice is stump');
    }
    const computerChoiceMessage = `Computer Choice is ${computerChoice}`

    let resultMessage;
    if(computerChoice === 'Ball'){
      resultMessage=('User Won!');
    }
    else if(computerChoice==='Bat'){
      resultMessage=(`It's a tie`)
    }
    else if(computerChoice==='Stump'){
      resultMessage=('Computer Won!');
    }
alert(`${userChoiceMessage} ${computerChoiceMessage} ${resultMessage}`)

    ">Bat</button>
  <button class="ball">Ball</button>
  <button class="stump">Stump</button>
  </div>
  </div>
 
  
</body>
</html>
