<!DOCTYPE html>
<html lang="en">
<head>
  <title>Print 5  Prime Numbers </title>
</head>
<body>
  <script>
    function isprime(num){
      for(let i=2;i<num;i++){
        if(num%i===0){
          return false;
        }
      }
      return true;
    }
    
    let num=2;
    let i=0;
    while(true){
      if(isprime(num)){
        console.log(num)
        i++;
        if(i>=5){
          break;
        }
      }
      num++;
    }
  </script>
  
</body>
</html>
