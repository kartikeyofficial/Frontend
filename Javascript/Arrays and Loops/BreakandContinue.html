<!DOCTYPE html>
<html lang="en">
<head>
  
  <title>Break & Continue</title>
</head>
<body>
  <script>
  for(let i=0;i<50;i++){
    if(i===30){
      break;
    }
    console.log(i);
  }
  let array = [4,5,6,8,9,1,2,4];
  for(let i=0;i<array.length;i++){
    if(array[i]===8){
      
      console.log(`Number is Found at Index: ${i}`);
      break;
      console.log('Still looking');
    }
  }
console.log('Print only Odd Numbers')
  for(let i=0;i<=25;i++){
    if(i%2===0){
      continue;
    }
    console.log(i);
  }
  </script>
  
</body>
</html>
