<!DOCTYPE html>
<html lang="en">
<head>
  <title>For Loop</title>
</head>
<body>
  <script>
    for(let i=1;i<=10;i++){
      console.log(i);
    }
    console.log('Array Printing\n')
    let nums = [13,42,63,44,75,86,97,28];
    for(let i=0;i<nums.length;i++){
      console.log(nums[i]);
    }

    console.log('Accumulator Pattern');
    let arr = [76,45,43,21,98,76,54,90];
    let sum=0;
    for(let i=0;i<arr.length;i++){
      sum += arr[i];
    }
    console.log(`Sum of the Array is: ${sum}`);
    let squares =[];
    for(let i=0;i<arr.length;i++){
      squares.push(arr[i]*arr[i]);
    
    }
    console.log(squares)
    
  </script>
  
</body>
</html>
