<!doctype html>
<html lang="en">
  <head>
    <title>Anonymous Function</title>
    <style>
      body {
        text-align: center;
        margin-top: 200px;
      }
      .btn {
        padding: 10px;
        border-radius: 8px;
        border: none;
        background-color: red;
        cursor: pointer;
        color: white;
      }
      .btn:hover {
        background-color: #58bb65;
        color: black;
      }
      .size-double {
        font-size: 30px;
        height: 60px;
        width: 160px;
      }
    </style>
  </head>
  <body>
    <button class="btn" onclick="setTimeout(doubleTheSize, 2000)">
      Subscribe
    </button>
    <script>
      // Task 1

      let multiply = (num1, num2) => num1 * num2;
      console.log(multiply(2, 2));

      // Task 2

      let printGreeting = () => console.log("Namaste");
      let runTwice = (inputFunction) => {
        inputFunction();
        inputFunction();
      };
      runTwice(printGreeting);

      // Task 3

      function doubleTheSize() {
        let buttonElement = document.querySelector(".btn");
        buttonElement.classList.add("size-double");
      }

      // Task 4

      let arr = [1,2,3,4,5];
      let sum = 0;
      arr.forEach(num => sum += num);
      console.log(sum)


      let squares = arr.map(num =>num*num);

      console.log(squares);
    </script>
  </body>
</html>
