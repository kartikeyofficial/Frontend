<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>practice Exercise</title>
</head>
<body>
  <script>
    let product = {
      company : 'Allen-Solly',
      item : 'Men Polo T-shirt',
      price : 1070,
      rate : 4.3,
      size : 'S',
      fit : 'Slim-fit',
      time : `7-8 Days`,
      Rating(){
        return `Product Rating is ${this.rate}`
      },
      Delivery_Time(){
        return `Parcel is Delivered at ${this.time}`
      }
    }

    console.log(product.Rating());
    console.log(product.Delivery_Time());
    console.log(product.size);
    product.size = 'M';
    console.log(product.size);
    console.log(product.fit);
    product.fit = 'Regular-fit';
    console.log(product.fit);

    let whatsApp={
        message : 'Good Job',
        status : 'Completed'
    }
    let {message,status} = whatsApp;
    console.log(message);
    console.log(status);
  </script>
  
</body>
</html>
