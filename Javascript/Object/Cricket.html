<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cricket Game</title>
  <style>
    .container{
      align-items: center;
      align-items: center;
      text-align: center;
    }
    .bat{
      padding: 5px;
      padding-left: 10px;
      padding-right: 10px;
      border: none;
      background-color: #84eb1d;
      border-radius: 8px;
      margin-right: 10px;
    }
    .ball{
      padding: 5px;
      padding-left: 10px;
      padding-right: 10px;
      border: none;
      background-color: #e7d90e;
      border-radius: 8px;
      margin-right: 10px;
    }
    .stump{
      padding: 5px;
      padding-left: 10px;
      padding-right: 10px;
      border: none;
      background-color: #e24a13;
      border-radius: 8px;
      margin-right: 10px;
    }
  </style>
</head>
<body>
  <div class="container">
  <h1>Bat Ball Stump Game</h1>
  <button class="bat" onclick="
  let computerChoice = generateComputerChoice();
  let resultMsg = getResult('Bat', computerChoice);
  showResult('Bat', computerChoice, resultMsg);
  ">Bat</button>

  <button class="ball" onclick="
    computerChoice = generateComputerChoice();
    resultMsg = getResult('Ball', computerChoice);
    showResult('Ball', computerChoice, resultMsg);
  ">Ball</button>

  <button class="stump" onclick="
    computerChoice = generateComputerChoice();
    resultMsg = getResult('Stump', computerChoice);
    showResult('Stump', computerChoice, resultMsg);
  ">Stump</button>
  </div>

  <script>
    let score = {
      win: 0,
      lost: 0,
      tie: 0,
      displayScore: function() {
        return `No of matches Won:${score.win}, Lost:${score.lost}, Tie: ${score.tie}`;
      }
    };

    function generateComputerChoice() {
      //This will generate random number between 0 and 3
      let randomNumber = Math.random() * 3;
      if (randomNumber > 0 && randomNumber <= 1) {
        return 'Bat';
      } else if (randomNumber > 1 && randomNumber <= 2) {
        return 'Ball';
      } else {
        return 'Stump'
      }
    }

    function getResult(userMove, computerMove) {
      if (userMove === 'Bat') {
        if (computerMove === 'Ball') {
          score.win++;
          return 'User won.';
        } else if (computerMove === 'Bat') {
          score.tie++;
          return `It's a tie`;
        } else if (computerMove === 'Stump') {
          score.lost++;
          return 'Computer has won';
        }
      } else if (userMove === 'Ball') {
        if (computerMove === 'Ball') {
          score.tie++;
          return `It's a tie`;
        } else if (computerMove === 'Bat') {
          score.lost++;
          return 'Computer has won';
        } else if (computerMove === 'Stump') {
          score.win++;
          return 'User won.';
        }
      } else {
        if (computerMove === 'Ball') {
          score.lost++;
          return 'Computer has won';
        } else if (computerMove === 'Bat') {
          score.win++;
          return 'User won.';
        } else if (computerMove === 'Stump') {
          score.tie++;
          return `It's a tie`;
        }
      }
    }
 
    function showResult(userMove, computerMove, result) {
      alert(`You have chosen ${userMove}. Computer choice is ${computerMove}
      
      ${result}
      
      ${score.displayScore()}`);
    }
  </script>
  
</body>
</html>
