<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nested Object</title>
</head>
<body>
  <script>
    let product={
      company : 'Mango',
      price : 861,
      'item-name' : 'T-Shirt',
      displayPrice: function(){
          console.log(`Price of The Product is ${this.price}₹`);
      }
    }
    product.displayPrice()
    console.log('kartikey'.toUpperCase())
    console.log('kartikey'.replace('kartikey','Rajput'))
    
    // let company = product.company;
    // console.log(company);
    let {company,price} = product;  // Destructuring
    console.log(company,price)

    // Method Shorthand
    let product1= {
      company : 'Mango',
      itemName : 'Cotton Stripped T-Shirt',
      displayPrice(){
        return `${this.itemName}`
      }
    }
    console.log(product1.displayPrice())

  </script>
  
</body>
</html>
