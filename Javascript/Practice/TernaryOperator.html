<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ternary Operator</title>
</head>
<body>
  <script>
    // Ternary Opertor
    let age =25;
    console.log(age>18 ? 'Aged':'Child');

    // Guard Operator

     let finalAge = age || 35;
     console.log(age);
     console.log(finalAge);
  </script>
  
</body>
</html>
