<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>navbar</title>
    <style>
        body{
            background-color: #303030;
            color: aliceblue;
        }
        .nav-container{
            margin-bottom: 40px;
        }
        h2{
            margin-bottom: 10px;
        }
        .nav1{
           
            background-color: #faf8f8;
            padding: 10px;
            border-radius: 10px;
        }
        .nav1 ul{
            list-style-type: none;
            margin: 0px;
            padding: 0px;
            display: flex;
            justify-content: space-around;
        }
        .nav1 li{
            display: inline;
            font-size: 30px;
        }
        .nav1 a{
            text-decoration: none;
            color: rgb(10, 10, 10);
            
            padding: 5px 15 px;
            position: relative;
            padding: 10px;
            border: #060007;
            border-radius: 10px;
            position: relative;

        }
        .nav1 .login-btn{
            padding: 10px;
            text-decoration: none;
            color: aliceblue;
            background-color: #205c87;
            border-radius: 10px;
            cursor: pointer;
        }
        .nav2{
            border: 2px solid red;
            border-radius: 10px;
            background-color: rgb(46, 124, 4);
            color: rgb(45, 86, 4);
            width: 200px;
            padding: 20px;
            font-family: Arial, Helvetica, sans-serif;
           
            

        }
        .nav2 ul{
            list-style-type: none;
            margin-right: 60px;
            padding: 0 px;

        }
        .nav2 li{
            margin-bottom: 10px;
        }
        .nav2 a{
            text-decoration: none;
            color: white;
            display: block;
            padding: 10px;
            width: 100%;
        }
        .nav2 a:hover{
            background-color: #51a659;
        }
        .nav2 .login-btn{
        font-family: Arial, Helvetica, sans-serif;
        font-size: large;
        background-color: #1c9101;
        color: white;
        border: none;
        width: 100%;
        padding: 10px;
        cursor: pointer;
        
        border-right: 60px;
        }
        .nav2 .login-btn:hover{
            background-color: #116502;
            border: 2px solid white;
        }
        .nav1 a::after{
            content: "";
            position: absolute;
            width: 100%;
            height: 2px;
            bottom: 0;
            left: 0;
            background-color: #1ea7a7;
            transform: scaleX(0);
            transition: transform 0.3s
            ease-in-out;
            
        }
        .nav1 a:hover::after{
            transform: scaleX(1);
        }
        .nav3{
            background-color: #65eed0;
            padding: 10px;

        }
        .nav3 ul{
            list-style-type: none;
            padding: 0;
            margin: 0;
            display: flex;
            justify-content: space-around;
            align-items: center;
        }
        .nav3 a{
            text-decoration: none;
            padding: 10px;
            display: block;
            color: white;
            font-size: 20px;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;


        }
        .nav3 .dropdown-content{
            display: none;
            
        }
        .nav3 .dropdown:hover .dropdown-content{
            display: block;
            position: absolute;
            background-color: #323232;
            min-width: 100px;
        }
         .nav3 .login-btn{
            padding: 10px;
            text-decoration: none;
            color: aliceblue;
            background-color: #205c87;
            border-radius: 10px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="nav-container">
       <h2>Variation 1:Horizontal with Underline effect</h2>
       <nav class="nav1">
          <ul>
            <li ><a href="#">Home</a></li>
            <li><a href="#">About</a></li>
            <li><a href="#">Products</a></li>
            <li><button
                class="login-btn">Login</button></li>
          </ul>
       </nav>
       <h2>Veriation 2: Vertical with Hover Effect</h2>
       <nav class="nav2">
          <ul>
            <li ><a href="#">Home</a></li>
            <li><a href="#">About</a></li>
            <li><a href="#">Products</a></li>
            <li><button
                class="login-btn">Login</button></li>
          </ul>
       </nav>
       <h2> Variation 3: Horizontal with Dropdown</h2>
       <nav class="nav3">
        <ul>
            <li><a href="#">Home</a></li>
            <li class="dropdown">
                <a href="#">About</a>
                <div class="dropdown-content">
                    <a href="#">Our Story</a>
                    <a href="#">Team</a>
                    <a href="#">Contact</a>
                </div>
            </li>
            <li><a href="#">Products</a></li>
            <li>
                <button
                class="login-btn">Login
                </button>
            </li>
        </ul>
       </nav>
    </div>
    
</body>
</html>
