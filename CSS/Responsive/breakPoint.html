<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Design</title>
    <style>
        body{
            margin: 0;
            padding: 0;
            font-family: Arial, Helvetica, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100hv;
            background-color: #aca9a9;
        }
        .responsive-div{
            width: 100%;
            max-width: 700px;
            font-size: 28px;
            color: aliceblue;
            background-color: #393838;
            padding: 20px;
            text-align: center;
            

        }
    </style>
</head>
<body>
    <div class="responsive-div">
        This div Chnages color based on the screen size.
    </div>
    
</body>
</html>
