<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chai Landing Page</title>
    <style>
        body,html{
            margin: 0;
            padding: 0;
            font-family: Arial, Helvetica, sans-serif;
            height: 100%;
        }  
        .container{
            background: linear-gradient(135deg, #8a2be2,#4169e1);
            justify-content: center;
            align-items: center;
            height: 100%;
            display: flex;
            

        }
        .content{
            text-align: center;
            background-color: rgba(255,255,255, 0.9);
            box-shadow: 0 10px 6px rgba(107, 35, 120, 0.9);
            padding: 2rem;
            border-radius: 10px;
            max-width: 400px;


        }
        .logo{
            width: 150px;
            box-shadow: 0 10px 6px rgba(103, 19, 109, 0.9);
            object-fit: contain;
        }
        h1{
            color: rgb(105, 3, 3);
            margin-bottom: 0.5rem;
            font-size: 40px;
            
        }
        p{
            color: rgb(87, 52, 7);
            font-size: 20px;
            margin-bottom:20px;
            
        }
        form{
            display: flex;
            flex-direction: column;
        }
        input[type="email"]{
            padding: 0.5rem;
            border-radius: 5px;
            border: 2px solid rgb(185, 184, 184);
            margin-bottom: 1rem;
            font-size: 20px;
            
            
            
        }
        button{
            padding: 0.5rem;
            border-radius:5px;
            border: 2px solid rgb(185, 184, 184);
            font-size: 20px;
            color: white;
            cursor: pointer;
            background-color: #8a2be2;
            box-shadow: 0 10px 9px rgba(103, 19, 109, 0.9);
            transition: background-color 0.5s
            ease-in-out;
           
        }
        button:hover{
            background-color: #07000f;
        }
       
    </style>
</head>
<body>
    <div class="container">
        <div class="content">
            <img src="chai1.png" class="logo" alt="Chai Photo">
            <h1>Comming Soon</h1>
            <p>We're Working hard to bring something amazing, stay Tuned!</p>
            <form id="notify-form">
                <input type="email" name="" id="" placeholder="Enter Your E-mail" required>
                <button type="submit">Notify Me</button>
            </form>
        </div>
    </div>
